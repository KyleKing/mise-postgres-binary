---
name: Freshness

"on":
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      HAS_APP: ${{ secrets.DONERAM_APP_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pkl evaluates .doneram.pkl and mise answers the tool resolvers.
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - uses: kyleking/doneram@9deb49166d65a924504e0b3cc1fa2a7459c22b44 # v0.6.1
        with:
          version: v0.6.1

      - id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: doneram update --output /tmp/doneram.json

      # GITHUB_TOKEN cannot push a branch that edits .github/workflows/**.
      # When the doneram app is installed with secrets set, its scoped
      # installation token covers that push; otherwise the job token opens
      # the PR and any workflow-file patch fails the push loudly.
      - id: app-token
        if: env.HAS_APP == 'true' && steps.check.outputs.has_upgrades == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.DONERAM_APP_CLIENT_ID }}
          private-key: ${{ secrets.DONERAM_APP_PRIVATE_KEY }}

      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        if: steps.check.outputs.has_upgrades == 'true'
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          branch: chore/doneram-updates
          draft: true
          delete-branch: true
          title: ${{ steps.check.outputs.title }}
          body: ${{ steps.check.outputs.body }}
